<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>手工织锦 · 试织排机与色线领用复核台</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, "PingFang SC", sans-serif; background: #f3efe7; color: #282018; }
    [hidden] { display: none !important; }
    header { padding: 18px 24px; background: #fffaf2; border-bottom: 1px solid #d9cdbc; display: flex; justify-content: space-between; gap: 16px; align-items: center; flex-wrap: wrap; }
    h1 { margin: 0; font-size: 26px; }
    h2 { font-size: 18px; }
    h3 { font-size: 15px; margin-bottom: 6px; }
    button { border: 0; border-radius: 8px; padding: 10px 13px; background: #8d3e37; color: #fff; font-weight: 800; cursor: pointer; }
    button.secondary { background: #71675c; }
    input, select { width: 100%; border: 1px solid #d9cdbc; border-radius: 6px; padding: 9px; font: inherit; background: #fff; }
    label { display: block; margin: 9px 0 5px; color: #76695e; font-size: 13px; }
    .app { display: grid; grid-template-columns: 280px 1fr 320px; gap: 16px; padding: 16px; }
    .panel { background: #fffaf2; border: 1px solid #d9cdbc; border-radius: 8px; padding: 14px; }
    .grid { display: grid; gap: 2px; margin: 0 auto; width: min(100%, 720px); border: 6px solid #72533c; background: #72533c; }
    .cell { aspect-ratio: 1; background: #f8ead2; cursor: pointer; border-radius: 2px; }
    .palette { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .swatch { aspect-ratio: 1; border-radius: 8px; border: 3px solid transparent; cursor: pointer; }
    .swatch.active { border-color: #1f1b16; }
    .blocks { display: grid; gap: 8px; }
    .stats { display: grid; gap: 8px; }
    .stat { display: flex; justify-content: space-between; border-bottom: 1px solid #e1d5c5; padding: 6px 0; }
    .preview { display: grid; grid-template-columns: repeat(6, 1fr); gap: 2px; border: 1px solid #d9cdbc; padding: 6px; margin-top: 8px; }
    .mini { aspect-ratio: 1; border-radius: 2px; }
    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; }
    .warning { color: #a03a2e; font-weight: 800; }
    .muted { color: #76695e; font-size: 12px; font-weight: 400; }
    .swatch-dot { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-right: 4px; }
    .msg { font-weight: 800; min-height: 1.2em; }
    .msg.ok { color: #355b38; }
    .msg.err { color: #a03a2e; }
    /* 排机复核台 */
    #stationTab { padding: 16px; display: grid; gap: 16px; }
    .station-grid { display: grid; grid-template-columns: 300px 1fr 340px; gap: 16px; align-items: start; }
    .cards { display: flex; flex-wrap: wrap; gap: 8px; }
    .card { background: #fff; border: 1px solid #d9cdbc; border-radius: 8px; padding: 8px 12px; min-width: 88px; text-align: center; }
    .card b { display: block; font-size: 20px; }
    .card span { color: #76695e; font-size: 12px; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; font-weight: 800; color: #fff; background: #71675c; }
    .st-待补料 { background: #b07d2b; }
    .st-在织 { background: #1f5f78; }
    .st-待复核 { background: #713d7b; }
    .st-返修 { background: #a03a2e; }
    .st-冻结 { background: #4a4a55; }
    .st-合格 { background: #355b38; }
    .st-已关机 { background: #8a8178; }
    .order-card { border: 1px solid #d9cdbc; border-radius: 8px; background: #fff; padding: 10px 12px; margin-bottom: 10px; }
    .order-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .order-meta { color: #76695e; font-size: 13px; margin: 4px 0; }
    .reasons { color: #a03a2e; font-size: 13px; font-weight: 700; }
    .note { color: #1f5f78; font-size: 13px; }
    .trial { font-size: 13px; padding: 4px 8px; border-left: 3px solid #355b38; margin: 4px 0; background: #f6f1e6; }
    .trial.archived { border-left-color: #8a8178; color: #8a8178; }
    .trial .arch-tag { font-weight: 800; }
    .actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
    .actions button { padding: 6px 10px; font-size: 13px; }
    .row-line { display: flex; justify-content: space-between; align-items: center; gap: 8px; border-bottom: 1px solid #e1d5c5; padding: 5px 0; font-size: 13px; }
    .row-line button { padding: 4px 8px; font-size: 12px; }
    .req-row { border: 1px solid #d9cdbc; border-radius: 8px; padding: 8px; margin-bottom: 8px; background: #fff; font-size: 13px; }
    .req-row input { margin: 6px 0; }
    .inline-form { display: flex; gap: 6px; margin: 8px 0; }
    .inline-form select, .inline-form input { width: auto; flex: 1; }
    .trial-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    #trialForm { border-top: 1px dashed #d9cdbc; margin-top: 10px; padding-top: 10px; }
    @media (max-width: 1100px) { header { display: block; } .app, .station-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>手工织锦 · 试织排机与色线领用复核台</h1>
      <div>纹样排版 → 排机试织 → 色线领用复核，全程留痕；规则、存储、展示三模块分离。</div>
    </div>
    <div class="toolbar">
      <button id="tabDesignBtn" class="secondary">纹样排版台</button>
      <button id="tabStationBtn">排机复核台</button>
      <button id="resetBtn" class="secondary">重置演示数据</button>
    </div>
  </header>

  <!-- 纹样排版台 -->
  <main class="app" id="designTab" hidden>
    <aside class="panel">
      <h2>画布</h2>
      <label>经向列数</label><input id="cols" type="number" value="18" min="6" max="36">
      <label>纬向行数</label><input id="rows" type="number" value="14" min="6" max="32">
      <button id="newBtn">新建网格</button>
      <h2>登记纹样</h2>
      <label>纹样编号</label><input id="patNo" value="P-1003">
      <label>版本</label><input id="patVer" value="v1.0">
      <button id="saveBtn">保存方案（登记入库）</button>
      <p id="designMsg" class="msg"></p>
      <h2>色线库</h2>
      <div class="palette" id="palette"></div>
      <h2>基础纹样块</h2>
      <div class="blocks">
        <button data-block="dot" class="secondary">单点</button>
        <button data-block="cross" class="secondary">十字</button>
        <button data-block="diamond" class="secondary">小菱形</button>
      </div>
    </aside>
    <section class="panel"><div class="grid" id="grid"></div></section>
    <aside class="panel">
      <h2>操作</h2>
      <div class="toolbar"><button id="undoBtn" class="secondary">撤销</button><button id="redoBtn" class="secondary">重做</button></div>
      <p>点击填色，按住拖动可连续填色。</p>
      <div class="toolbar"><button id="exportBtn" class="secondary">导出JSON</button></div>
      <h2>用色统计</h2>
      <div class="stats" id="stats"></div>
      <h2>重复单元预览</h2>
      <div class="preview" id="preview"></div>
      <h2>断线风险</h2>
      <div id="risk"></div>
    </aside>
  </main>

  <!-- 试织排机与色线领用复核台 -->
  <main id="stationTab">
    <section class="panel">
      <h2>汇总 <span class="muted">（汇总由存储状态实时推算，刷新页面后保持一致；留档旧结果不计入合格统计）</span></h2>
      <div class="cards" id="sumCards"></div>
      <p id="stationMsg" class="msg"></p>
    </section>
    <div class="station-grid">
      <section class="panel">
        <h2>排机登记</h2>
        <label>纹样（编号 / 版本）</label><select id="schPattern"></select>
        <label>织机号</label><select id="schLoom"></select>
        <label>经线批次</label><select id="schBatch"></select>
        <label>色线领用单</label><select id="schReq"></select>
        <label>预计完成日</label><input id="schDue" type="date">
        <p></p>
        <button id="schBtn">登记排机</button>
        <h3>织机状态</h3><div id="loomList"></div>
        <h3>经线批次</h3><div id="batchList"></div>
      </section>
      <section class="panel">
        <h2>工单与试织记录</h2>
        <div id="orderList"></div>
        <div id="trialForm" hidden>
          <h3>录入试织记录 <span id="trialOrder" class="badge st-在织"></span></h3>
          <div class="trial-grid">
            <div><label>断线次数（上限 <span id="limBreaks"></span> 次）</label><input id="tfBreaks" type="number" min="0" value="1"></div>
            <div><label>经密（<span id="limWarp"></span>）</label><input id="tfWarp" type="number" min="0" value="40"></div>
            <div><label>纬密（<span id="limWeft"></span>）</label><input id="tfWeft" type="number" min="0" value="36"></div>
            <div><label>样片结果</label><select id="tfSample"><option>合格</option><option>瑕疵</option></select></div>
          </div>
          <p></p>
          <button id="tfSubmit">提交试织记录</button>
          <button id="tfCancel" class="secondary">取消</button>
        </div>
      </section>
      <section class="panel">
        <h2>色线库存</h2>
        <div id="stockList"></div>
        <div class="inline-form">
          <select id="stockColor"></select>
          <input id="stockQty" type="number" min="1" value="10">
          <button id="stockBtn">入库</button>
        </div>
        <h2>色线领用单</h2>
        <p class="muted">更正 / 撤换后，关联排机与合格结论立即失效并重算。</p>
        <div id="reqList"></div>
        <h2>纹样版本库</h2>
        <p class="muted">纹样按「编号 + 版本」唯一。</p>
        <div id="patternList"></div>
      </section>
    </div>
  </main>

  <!-- 三个业务模块：规则 / 记录存储 / 页面展示 -->
  <script src="rules.js"></script>
  <script src="store.js"></script>
  <script src="app.js"></script>
</body>
</html>
